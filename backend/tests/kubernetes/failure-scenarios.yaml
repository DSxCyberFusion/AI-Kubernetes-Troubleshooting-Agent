apiVersion: v1
kind: Namespace
metadata:
  name: troubleshooting-agent-test
  labels:
    app.kubernetes.io/part-of: ai-kubernetes-troubleshooting-agent-tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-missing-env
  namespace: troubleshooting-agent-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-missing-env
  template:
    metadata:
      labels:
        app: crashloop-missing-env
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'if [ -z "$REQUIRED_SETTING" ]; then echo "Missing REQUIRED_SETTING"; exit 1; fi; sleep 3600'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull-invalid-tag
  namespace: troubleshooting-agent-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagepull-invalid-tag
  template:
    metadata:
      labels:
        app: imagepull-invalid-tag
    spec:
      containers:
        - name: app
          image: busybox:invalid-tag-for-agent-test
---
apiVersion: v1
kind: Pod
metadata:
  name: oom-limited
  namespace: troubleshooting-agent-test
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "x=$(head -c 134217728 /dev/zero | tr '\\000' x); sleep 10"
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-mismatch-app
  namespace: troubleshooting-agent-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selector-mismatch-pod
  template:
    metadata:
      labels:
        app: selector-mismatch-pod
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: selector-mismatch
  namespace: troubleshooting-agent-test
spec:
  selector:
    app: selector-mismatch-service
  ports:
    - port: 80
      targetPort: 80
